# Compila Web (GitHub Pages), APK (Android) y .exe (Windows) en cada push a main.
# Versión (SemVer): poné [patch], [minor] o [major] en el mensaje del commit para crear una Release.
# Sin marca: se publica la web y quedan APK y .exe de prueba (Artifacts), pero NO se crea Release.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de Release"
        type: choice
        options: [ninguna, patch, minor, major]
        default: ninguna

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  FLUTTER_CREATE: flutter create --project-name multigdrive --org com.luchorcompartidos

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      number: ${{ steps.v.outputs.number }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Calcular versión desde los tags
        env:
          MSG: ${{ github.event.head_commit.message }}
          BUMP_IN: ${{ github.event.inputs.bump }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$last" ] && last="v0.0.0"
          IFS=. read -r MA MI PA <<< "${last#v}"
          bump=""
          case "$MSG" in
            *"[skip release]"*) bump="" ;;
            *"[major]"*) bump=major ;;
            *"[minor]"*) bump=minor ;;
            *"[patch]"*) bump=patch ;;
          esac
          if [ -n "$BUMP_IN" ] && [ "$BUMP_IN" != "ninguna" ]; then bump="$BUMP_IN"; fi
          case "$bump" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          CODE=$((MA*10000 + MI*100 + PA)); [ "$CODE" -lt 1 ] && CODE=1
          echo "number=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ -n "$bump" ]; then
            echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release nueva: v$MA.$MI.$PA ($bump)"
          else
            echo "version=$MA.$MI.$PA-prueba" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sin Release::El commit no tiene [patch], [minor] ni [major]. Se publica la web y quedan APK y .exe de prueba, pero no se crea Release. Para crearla, usá 'Run workflow' y elegí el tipo."
            {
              echo "## ⚠️ Push sin Release"
              echo
              echo "No se creó tag ni Release. La web se publica igual; el APK y el .exe de prueba quedan en *Artifacts*."
              echo
              echo "**¿Preferís crear una versión de este cambio?** Entrá a [CI]($LINK), tocá **Run workflow** y elegí el tipo (patch, minor o major)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: $FLUTTER_CREATE --platforms=web .
      - name: Compilar web
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          sed -i 's#<title>[^<]*</title>#<title>Multi G-DRIVE</title>#' build/web/index.html
          cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: $FLUTTER_CREATE --platforms=android .
      - name: Permiso de Internet y nombre de la app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Multi G-DRIVE"#' "$M"
          grep -n "INTERNET\|android:label" "$M"
      - name: Compilar APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.number }} \
            --build-number=${{ needs.version.outputs.code }} \
            --dart-define=APP_VERSION=$VERSION \
            --dart-define=DESKTOP_CLIENT_SECRET=${{ secrets.DESKTOP_CLIENT_SECRET }}
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/multigdrive-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name multigdrive --org com.luchorcompartidos --platforms=windows .
      - name: Compilar .exe
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.number }} `
            --build-number=${{ needs.version.outputs.code }} `
            --dart-define=APP_VERSION=$env:VERSION `
            --dart-define=DESKTOP_CLIENT_SECRET=${{ secrets.DESKTOP_CLIENT_SECRET }}
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "out\multigdrive-windows-v$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  release:
    needs: [version, android, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
